info:
  name: API Mockoon Generate Token
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3001/api/token
  body:
    type: json
    data: |-
      {
        "grant_type": "client_credentials",
        "client_id": "ABC",
        "client_secret": "DEF"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
